spring:
  application:
    name: rentalservice-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-placeholder-client-secret}
            scope:
              - openid
              - email
              - profile
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/rental_service}
    username: ${DB_USER:rental_user}
    password: ${DB_PASSWORD:rental_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: ${SERVER_PORT:8088}
  error:
    include-message: always

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:${SMTP_USERNAME:no-reply@rental.local}}
  integrations:
    yandex-maps:
      base-url: ${YANDEX_GEOCODING_URL:https://geocode-maps.yandex.ru/1.x/}
      api-key: ${YANDEX_GEOCODER_API_KEY:}
  logistics:
    depot:
      latitude: ${DEPOT_LATITUDE:53.9023}
      longitude: ${DEPOT_LONGITUDE:27.5619}
    free-distance-km: ${LOGISTICS_FREE_DISTANCE_KM:5}
    surcharge-per-km: ${LOGISTICS_SURCHARGE_PER_KM:2}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-123456}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
